server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Lazy DNS: koshub startet auch ohne kaga im Netz.
        resolver 127.0.0.11 valid=10s;
        set $kaga http://kaga:8090;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $kaga;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Api-Key       "dev-kosmos-key";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
